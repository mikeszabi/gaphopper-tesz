# Gaphopper zárt szótárak – a kódok stabilak, a nevek változhatnak.
# hu = jelenlegi magyar név, gyok = gyökös javaslat, en = angol megfeleltetés
version: "2026-10-22-mag"

tesz_tipus:
  PREPARE:          {hu: "előkészít",               gyok: "ELŐ-KÉSZ-ít",        en: "prepare"}
  OBSERVE_MEASURE:  {hu: "megfigyel / mér",         gyok: "FIGY-el, MÉR",       en: "observe, measure"}
  ASSESS_ANALYSE:   {hu: "értékel / elemez",        gyok: "ÉRT-ékel",           en: "assess, analyse"}
  PLAN:             {hu: "tervez / ütemez",         gyok: "TERV-ez",            en: "plan"}
  DECIDE:           {hu: "felelősen dönt",          gyok: "DÖNT",               en: "decide"}
  CREATE_DESIGN:    {hu: "újat alkot",              gyok: "ALK-ot",             en: "create"}
  EXECUTE:          {hu: "ismert eljárást végrehajt", gyok: "VÉGRE-HAJT",       en: "execute"}
  OPERATE_USE:      {hu: "gépet / rendszert működtet", gyok: "HASZ-nál, MŰ-ködtet", en: "operate, use"}
  PROBLEM_SOLVE:    {hu: "hibát feltár és megold",  gyok: "GOND-ot OLD",        en: "solve problems"}
  VERIFY:           {hu: "kritériumhoz képest ellenőriz", gyok: "ELLEN-ŐR-iz",  en: "verify"}
  DOCUMENT:         {hu: "rögzít",                  gyok: "LE-ÍR, RÖGZ-ít",     en: "document"}
  COMMUNICATE:      {hu: "címzettnek átad",         gyok: "KÖZ-öl",             en: "communicate"}
  COORDINATE:       {hu: "mások munkáját összehangolja", gyok: "ÖSSZE-HANG-ol", en: "coordinate"}
  SUPPORT_SERVE:    {hu: "másik ember szükségletét kielégíti", gyok: "SEG-ít, SZOLG-ál", en: "support, serve"}
  COMPLY:           {hu: "előírást alkalmaz és igazol", gyok: "BE-TART",        en: "comply"}
  IMPROVE:          {hu: "mérhetően javít",         gyok: "JAV-ít",             en: "improve"}

kozeg:
  KOZ_FIZIKAI:    {hu: "Fizikai",    gyok: "ANYAG-i közeg",     en: "physical"}
  KOZ_TARSAS:     {hu: "Társas",     gyok: "TÁRS-as közeg",     en: "social"}
  KOZ_DIGITALIS:  {hu: "Digitális",  gyok: "JEL-közeg",         en: "digital"}
  KOZ_SZERVEZETI: {hu: "Szervezeti", gyok: "SZER-vezeti közeg", en: "organisational"}
  KOZ_TERMESZET:  {hu: "Természet",  gyok: "TERM-észeti közeg", en: "natural"}

helyzet:
  # tengely: KISZ = kiszámíthatóság (sorrendes, fok 0..4: a MÉLY-ítés lánca), SZEREP = szerep (nem sorrendes, fok: null)
  HELY_TANULASI:       {hu: "Betanulási",     gyok: "TAN-uló helyzet",      en: "learning",      tengely: KISZ,   fok: 0}
  HELY_RUTIN:          {hu: "Rutin",          gyok: "SZOK-ásos helyzet",    en: "routine",       tengely: KISZ,   fok: 1}
  HELY_VALTOZO:        {hu: "Változó",        gyok: "VÁLT-ozó helyzet",     en: "changing",      tengely: KISZ,   fok: 2}
  HELY_PROBLEMA:       {hu: "Probléma",       gyok: "GOND-helyzet",         en: "problem",       tengely: KISZ,   fok: 3}
  HELY_KRITIKUS:       {hu: "Kritikus",       gyok: "VÉSZ-helyzet",         en: "critical",      tengely: KISZ,   fok: 4}
  HELY_DONTESI:        {hu: "Döntési",        gyok: "DÖNT-ési helyzet",     en: "decision",      tengely: SZEREP, fok: null}
  HELY_ALKOTO:         {hu: "Alkotó",         gyok: "ALK-otó helyzet",      en: "creative",      tengely: SZEREP, fok: null}
  HELY_EGYUTTMUKODESI: {hu: "Együttműködési", gyok: "EGY-ütt-működő helyzet", en: "collaborative", tengely: SZEREP, fok: null}
  HELY_SZOLGALTATASI:  {hu: "Szolgáltatási",  gyok: "SZOLG-áló helyzet",    en: "service",       tengely: SZEREP, fok: null}
  HELY_IRANYITASI:     {hu: "Irányítási",     gyok: "VEZ-ető helyzet",      en: "leading",       tengely: SZEREP, fok: null}
  HELY_TANITO:         {hu: "Tanító",         gyok: "TAN-ító helyzet",      en: "teaching",      tengely: SZEREP, fok: null}

szer_elem_fajta:
  TOOL:        {hu: "ESZKÖZ"}
  MATERIAL:    {hu: "ANYAG"}
  OBJECT:      {hu: "TÁRGY"}
  SYSTEM:      {hu: "REND-szer"}
  DATA:        {hu: "AD-at"}
  INFORMATION: {hu: "ISMER-et"}
  RULE:        {hu: "SZAB-ály"}
  METHOD:      {hu: "EL-JÁR-ás"}
  PLAN:        {hu: "TERV"}
  MODEL:       {hu: "MINTA"}
  STATE:       {hu: "ÁLL-apot"}
  RESULT:      {hu: "ERED-mény"}
  ENVIRONMENT: {hu: "KÖR-nyezet"}

szer_elem_szerep: [ACTS_ON, USES, GUIDED_BY, INPUT, PRODUCES]
relevance: [CORE, SUPPORTING]
frequency: [DAILY, WEEKLY, MONTHLY, RARE]

# Determinisztikus megfeleltetés a zárt listákra (a modell gyakori, egyértelmű eltérései).
# Csak itt felsorolt érték alakul át; minden más ismeretlen érték sémahiba marad.
alias_ertek:
  frequency: {HOURLY: DAILY, SHIFT: DAILY, PER_SHIFT: DAILY, BIWEEKLY: WEEKLY, QUARTERLY: MONTHLY,
              SEMESTER: RARE, SEMIANNUAL: RARE, ANNUAL: RARE, YEARLY: RARE, OCCASIONAL: RARE,
              PER_CAMPAIGN: MONTHLY, PER_PROJECT: MONTHLY, AD_HOC: RARE, AS_NEEDED: RARE}
  relevance: {PERIPHERAL: SUPPORTING, SECONDARY: SUPPORTING, AUXILIARY: SUPPORTING, ESSENTIAL: CORE, PRIMARY: CORE}

# A TESZ-típus "természetes párja" a HELY-zetek között (R6 szabály)
termeszetes_par:
  PROBLEM_SOLVE: HELY_PROBLEMA
  CREATE_DESIGN: HELY_ALKOTO
  DECIDE: HELY_DONTESI
  COORDINATE: HELY_IRANYITASI
  SUPPORT_SERVE: HELY_SZOLGALTATASI
  COMPLY: HELY_KRITIKUS

# Szabálykuszöbök (P2, determinisztikus). Kalibrálandók a referenciakészleten.
rules:
  mag_min: 10              # TESZ-MAG-ok száma munkakörönként
  mag_max: 18
  tesz_min: 12             # TESZ-nivalók (SZÍN-ezett változatok) száma
  tesz_max: 25
  core_min: 8              # CORE MAG-ok száma
  core_max: 15
  variants_per_mag_max: 3  # R12
  mag_per_kor_min: 1       # R9: feladatkör MAG nélkül (kalibrálva 2 -> 1, 2026-10-22)
  szin_kulonbseg_words_min: 4  # R13: a nem ALAP-SZÍN változat indoklása legalább ennyi szó
  label_words_min: 4  # magyarul az összetett szavak miatt 4 is elég (változat-címke)
  mag_label_words_min: 3  # a SZÍN-semleges MAG-címke rövidebb (kalibrálva, 2026-10-22)
  label_words_max: 14
  execute_max_share: 0.40  # a MAG-okra számolva (kalibrálva 0.30 -> 0.40, 2026-10-22: villanyszerelő 33–36%)
  natural_pair_max_share: 0.60
  kritikus_max_share: 0.25
  kritikus_max_share_high_risk: 0.40
  high_risk_fields: ["health", "egészség", "energy", "energia", "security", "biztonság", "safety"]
  confidence_min: 0.6
  # R14: SZÍN-jelző a MAG címkéjében (a MAG KÖZ-eg- és HELY-zet-semleges). Szótőre illesztve, kisbetűvel.
  szin_jelzok: ["sürgős", "kritikus", "vészhelyzet", "krízis", "rutin", "digitális", "elektronikus", "online",
                "telefonos", "távoli", "virtuális", "papíralapú", "terepen", "terepi", "váratlan",
                "rendkívüli", "időnyomás", "emergency", "urgent", "critical", "digital", "online", "remote",
                "telephone", "routine"]
  forbidden_label_patterns:
    - "alkalmazása a szakmai munkában"
    - "in professional work"
    - "methods and reference material"
    - "perform the core professional procedure"
    - "szakmai alapeljárás"
